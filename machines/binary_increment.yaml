name: binary_increment
description: "Ikili sayıyı 1 artırır. Örnek: 1011 -> 1100"

states:
  - carry
  - done
  - q_accept

input_alphabet:
  - "0"
  - "1"

tape_alphabet:
  - "0"
  - "1"
  - "B"

blank: "B"

start_state: carry

accept_states:
  - q_accept

reject_states: []

transitions:
  # carry durumunda sağdan sola tarama
  carry:
    "1": ["0", "L", "carry"]
    "0": ["1", "L", "done"]
    "B": ["1", "R", "done"]

  # done durumunda sola gitmeye devam et, sonra sağa geç
  done:
    "0": ["0", "L", "done"]
    "1": ["1", "L", "done"]
    "B": ["B", "R", "q_accept"]

  # q_accept: kabul durumu, şeridi sağa tara
  q_accept:
    "0": ["0", "R", "q_accept"]
    "1": ["1", "R", "q_accept"]
    "B": ["B", "R", "q_accept"]
