name: binary_increment
description: "Ikili sayıyı 1 artırır. Örnek: 1011 -> 1100"

states:
  - q_right
  - carry
  - q_return
  - q_accept

input_alphabet:
  - "0"
  - "1"

tape_alphabet:
  - "0"
  - "1"
  - "B"

blank: "B"

start_state: q_right

accept_states:
  - q_accept

reject_states: []

transitions:
  # Şeridin sonuna kadar ilerle
  q_right:
    "0": ["0", "R", "q_right"]
    "1": ["1", "R", "q_right"]
    "B": ["B", "L", "carry"]

  # Sağdan sola: 1'leri 0'a çevir (elde taşı)
  # 0 bulunca 1 yaz, başa dön, kabul et
  # Blank: tüm basamaklar 1'di, buraya 1 yaz, başa dön
  carry:
    "1": ["0", "L", "carry"]
    "0": ["1", "L", "q_return"]
    "B": ["1", "L", "q_return"]

  # Başa dön (blank'e kadar sola git)
  q_return:
    "0": ["0", "L", "q_return"]
    "1": ["1", "L", "q_return"]
    "B": ["B", "R", "q_accept"]

  # Kabul durumu
  q_accept:
    "0": ["0", "R", "q_accept"]
    "1": ["1", "R", "q_accept"]
    "B": ["B", "R", "q_accept"]
